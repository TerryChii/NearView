<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NearView Annotation</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        pointer-events: none;
        background: transparent;
        font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      }
      #surface {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      #labels {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .annotation-label-chip {
        position: absolute;
        display: inline-flex;
        max-width: 180px;
        padding: 4px 7px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 6px;
        background: rgba(10, 17, 14, 0.82);
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.22);
        font-size: 10px;
        font-weight: 700;
        line-height: 1;
        text-overflow: ellipsis;
        white-space: nowrap;
        animation: label-fade 2.8s ease forwards;
      }
      .pulse {
        transform-box: fill-box;
        transform-origin: center;
        animation: pulse 1.3s ease-out infinite;
      }
      @keyframes pulse {
        0% { opacity: 1; r: 1; stroke-width: 2; }
        100% { opacity: 0.12; r: 6; stroke-width: 1; }
      }
      @keyframes label-fade {
        0%, 70% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </head>
  <body>
    <svg id="surface" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke" />
        </marker>
      </defs>
      <g id="marks"></g>
    </svg>
    <div id="labels"></div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
