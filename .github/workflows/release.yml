name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Package portable archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path release/win-unpacked/* `
            -DestinationPath "release/NearView-${{ github.ref_name }}-win-x64.zip" `
            -CompressionLevel Optimal
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true
